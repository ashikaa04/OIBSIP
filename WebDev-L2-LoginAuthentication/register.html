<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create Account | Northstar</title><link rel="stylesheet" href="style.css"><script src="auth.js" defer></script></head>
<body><main class="layout"><aside class="side"><a class="brand" href="index.html">✳ northstar</a><div><small>START SOMETHING GOOD</small><h1>Your next<br>chapter begins<br><em>right here.</em></h1><p>Set up your account in a few simple steps.</p></div><small class="foot">02 / CREATE YOUR ACCOUNT</small></aside><section class="main"><div class="form"><p class="eyebrow">GET STARTED</p><h2>Create your account.</h2><p class="sub">It only takes a moment to get set up.</p><form id="register-form" novalidate><label for="username">Username</label><input id="username" autocomplete="username" placeholder="Choose a username"><label for="email">Email address</label><input id="email" type="email" autocomplete="email" placeholder="you@example.com"><label for="reg-password">Password</label><div class="pass"><input id="reg-password" type="password" autocomplete="new-password" placeholder="At least 8 characters"><button type="button" data-toggle="reg-password">Show</button></div><p class="hint">Use 8+ characters and include at least one number.</p><p class="message" id="register-message" role="alert"></p><button class="primary" type="submit">Create account <span>→</span></button></form><p class="switch">Already have an account? <a href="index.html">Login</a></p></div></section></main></body></html>
